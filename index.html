<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sihirbazlık Numarası</title>
    <meta name="description" content="Aklindan tuttugun sayiyi bilen kucuk bir sihirbazlik numarasi." />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <main class="magic-shell">
      <div class="spotlight" aria-hidden="true"></div>
      <div class="spark spark-one" aria-hidden="true">✦</div>
      <div class="spark spark-two" aria-hidden="true">✧</div>
      <div class="spark spark-three" aria-hidden="true">✦</div>

      <section class="magic-card" aria-live="polite">
        <div class="hat" aria-hidden="true">
          <div class="hat-top"></div>
          <div class="hat-band"></div>
          <div class="hat-brim"></div>
          <span class="wand">✦</span>
        </div>

        <p class="eyebrow">Canlı gösteri</p>
        <h1 id="title">Sihirli Sayı Numarası</h1>
        <p class="subtitle" id="instruction">
          Aklından bir sayı tut. Birkaç hamle sonra sonucu ben söyleyeceğim.
        </p>

        <div class="progress-wrap" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="step-counter" id="stepCounter">Hazır</div>

        <div class="button-row">
          <button class="primary-button" id="nextButton" type="button">Başlat</button>
          <button class="ghost-button" id="resetButton" type="button" hidden>Tekrar yap</button>
        </div>

        <p class="stage-note" id="stageNote">Sayıyı yüksek sesle söyleme. Sihir kaçmasın.</p>
      </section>
    </main>
    <script src="app.js?v=4"></script>
  </body>
</html>
